<div id="motionRoot">
  <video id="motionVideo" class="motion-video" autoplay playsinline muted hidden></video>
  <div class="motion-camera-placeholder" id="motionPlaceholder">
    <i class="fas fa-camera"></i>
    <p>Tap the record button below to set up and start a scan.</p>
  </div>
  <div class="motion-scan-overlay" id="motionScanOverlay"><div class="motion-scan-line"></div></div>

  <div class="motion-hud">
    <div class="motion-prompt-chip" id="motionPromptChip" hidden></div>
    <div class="motion-angle-chip" id="motionAngleChip"><i class="fas fa-ruler"></i> <span id="motionAngleValue">—</span></div>
  </div>

  <div class="motion-controls">
    <button class="motion-fab" id="motionPrefsBtn" aria-label="Preferences" title="Preferences">
      <i class="fas fa-sliders-h"></i>
    </button>
    <button class="motion-record-btn" id="motionRecordBtn" aria-label="Start">
      <span class="motion-record-inner"></span>
    </button>
    <button class="motion-fab" id="motionCameraSettingsBtn" aria-label="Camera settings" title="Camera settings">
      <i class="fas fa-camera-retro"></i>
    </button>
  </div>
</div>

<!-- Preferences modal — auto-opens if the user tries to start without setup -->
<div class="motion-modal" id="motionPrefsModal">
  <div class="motion-modal-overlay"></div>
  <div class="motion-modal-card">
    <button class="motion-modal-close" id="motionPrefsClose">&times;</button>
    <h3><i class="fas fa-sliders-h"></i> Scan Preferences</h3>

    <div class="form-group">
      <label>Analysis Type</label>
      <select class="motion-type-select" id="motionTypeSelect" aria-label="Analysis type">
        <option value="rom">Range of Motion</option>
        <option value="gait">Gait Analysis</option>
      </select>
    </div>

    <div class="form-group">
      <label>Patient Name (optional)</label>
      <input type="text" id="motionPatientName" placeholder="e.g. John Doe">
    </div>

    <div class="form-group" id="motionRomFields">
      <label>Assessment Mode</label>
      <select id="motionAssessmentMode">
        <option value="isolate">Isolate a single movement</option>
        <option value="full">Full joint region assessment</option>
      </select>
    </div>

    <div class="form-group" id="motionMovementField">
      <label>Movement / Joint</label>
      <select id="motionMovementSelect"></select>
    </div>

    <div class="form-group" id="motionGaitFields" hidden>
      <label>View / Condition</label>
      <select id="motionGaitView">
        <option value="Sagittal View (side)">Sagittal View (side)</option>
        <option value="Frontal View (front)">Frontal View (front)</option>
        <option value="Posterior View (back)">Posterior View (back)</option>
      </select>
    </div>
    <div class="form-group" id="motionGaitNotesField" hidden>
      <label>Notes (optional)</label>
      <textarea id="motionGaitNotes" rows="3" placeholder="Anything relevant to this gait assessment…"></textarea>
    </div>

    <div class="form-group">
      <label class="motion-auto-guided-label" style="display:flex;align-items:center;gap:0.5rem;text-transform:none;font-weight:500;font-size:0.85rem;color:var(--text-primary);">
        <input type="checkbox" id="motionAutoGuided" checked style="width:auto;">
        Auto-guided scan (voice + auto-capture)
      </label>
    </div>

    <button class="btn-primary" id="motionPrefsSaveBtn">Start Scan</button>
  </div>
</div>

<!-- Camera settings modal -->
<div class="motion-modal" id="motionCameraModal">
  <div class="motion-modal-overlay"></div>
  <div class="motion-modal-card">
    <button class="motion-modal-close" id="motionCameraClose">&times;</button>
    <h3><i class="fas fa-camera-retro"></i> Camera View Settings</h3>

    <div class="motion-slider-row">
      <label>Brightness</label>
      <input type="range" id="motionBrightness" min="70" max="150" value="100">
      <span id="motionBrightnessVal">100%</span>
    </div>
    <div class="motion-slider-row">
      <label>Contrast</label>
      <input type="range" id="motionContrast" min="70" max="150" value="100">
      <span id="motionContrastVal">100%</span>
    </div>
    <div class="motion-slider-row">
      <label>Saturation</label>
      <input type="range" id="motionSaturation" min="0" max="200" value="100">
      <span id="motionSaturationVal">100%</span>
    </div>

    <button class="btn-primary" id="motionCameraResetBtn">Reset to Default</button>
  </div>
</div>

<!-- Analyzing overlay -->
<div class="motion-analyzing" id="motionAnalyzing">
  <div class="motion-analyzing-spinner"></div>
  <div class="motion-analyzing-text" id="motionAnalyzingText">Analyzing…</div>
  <div class="motion-analyzing-sub" id="motionAnalyzingSub">This usually takes a few seconds.</div>
</div>

<!-- Results overlay -->
<div class="motion-results" id="motionResults">
  <div class="motion-results-header">
    <h3 id="motionResultsTitle">Analysis</h3>
    <div class="motion-results-actions">
      <button class="motion-icon-btn" id="motionEditBtn" title="Edit"><i class="fas fa-pen"></i></button>
      <button class="motion-icon-btn" id="motionShareBtn" title="Share"><i class="fas fa-share-alt"></i></button>
      <button class="motion-icon-btn" id="motionPrintBtn" title="Print"><i class="fas fa-print"></i></button>
      <button class="motion-icon-btn" id="motionDownloadBtn" title="Download"><i class="fas fa-download"></i></button>
    </div>
  </div>
  <div class="motion-results-body" id="motionResultsBody"></div>
  <div class="motion-results-footer">
    <button class="btn-secondary" id="motionRetakeBtn"><i class="fas fa-redo"></i> Retake Session</button>
    <button class="btn-primary" id="motionNewSessionBtn"><i class="fas fa-plus"></i> New Session</button>
  </div>
</div>
