<!-- Dedicated Assessment Format viewer/editor — reuses the same full-screen
     "results" interface as Motion (css/motion-view.css .motion-results*)
     instead of the shared multi-type #/result editor. Loaded via
     index.html?id=...#/formatview (see js/views/formatview-view.js). -->
<div class="motion-results active" id="formatViewRoot">
  <div class="motion-results-header">
    <div class="formatview-header-title">
      <button class="motion-icon-btn" id="formatViewBackBtn" aria-label="Back" title="Back"><i class="fas fa-arrow-left"></i></button>
      <h3 id="formatViewTitle">Loading…</h3>
    </div>
    <div class="motion-results-actions">
      <button class="motion-icon-btn" id="formatViewEditBtn" title="Edit"><i class="fas fa-pen"></i></button>
      <button class="motion-icon-btn" id="formatViewShareBtn" title="Share"><i class="fas fa-share-alt"></i></button>
      <button class="motion-icon-btn" id="formatViewPrintBtn" title="Print"><i class="fas fa-print"></i></button>
      <button class="motion-icon-btn" id="formatViewDownloadBtn" title="Download as PDF"><i class="fas fa-download"></i></button>
    </div>
  </div>
  <div class="motion-results-body" id="formatViewBody" spellcheck="false">Loading…</div>
  <div class="motion-results-footer">
    <button class="btn-secondary" id="formatViewNewBtn"><i class="fas fa-plus"></i> New Assessment</button>
    <button class="btn-primary" id="formatViewCloseBtn"><i class="fas fa-check"></i> Done</button>
  </div>
</div>
