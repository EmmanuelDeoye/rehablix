<main class="result-container">
  <div class="print-header">
    <h2>rehablix Assessment</h2>
    <p>Generated: <span id="printDate"></span></p>
  </div>

  <div class="result-header no-print">
    <div>
      <h1 id="resultTitle">Assessment Result</h1>
      <div class="result-badges" id="resultBadges">
        <span class="badge" id="patientNameBadge">👤 Loading...</span>
        <span class="badge" id="assessmentTypeBadge"></span>
        <span class="badge" id="departmentBadge"></span>
      </div>
    </div>

    <!-- Owner-only toggle -->
    <div id="publicToggleContainer" style="display: none;" class="public-toggle no-print">
      <label class="switch-label">
        <span>🔓 Make public</span>
        <div class="switch">
          <input type="checkbox" id="publicToggle">
          <span class="slider round"></span>
        </div>
      </label>
    </div>

    <div class="result-actions">
      <button class="action-btn" id="shareBtn">
        <span>🔗</span> Share
      </button>
      <button class="action-btn" id="copyBtn">
        <span>📋</span> Copy
      </button>
      <button class="action-btn" id="saveBtn">
        <span>💾</span> Save
      </button>
      <button class="action-btn" id="downloadBtn">
        <span>⬇️</span> Download
      </button>
      <button class="action-btn primary" id="printBtn">
        <span>🖨️</span> Print / PDF
      </button>
    </div>
  </div>

  <!-- Rich Text Editor Container -->
  <div class="editor-container no-print">
    <textarea id="editor"></textarea>
  </div>

  <!-- Fallback read-only view -->
  <div id="assessmentOutput" style="display: none;"></div>

  <div class="result-navigation no-print" style="margin-top: 2rem; text-align: center;">
    <a href="index.html#/format" class="btn-secondary" style="display: inline-block; padding: 0.8rem 2rem;">← Back to Generator</a>
  </div>
</main>

<!-- Download Modal -->
<div id="downloadModal" class="modal download-modal">
  <div class="modal-content glass download-content">
    <h3>Choose Download Format</h3>
    <div class="download-options">
      <button class="btn-primary" id="downloadWordOption">📃 Word Document (.doc)</button>
      <button class="btn-primary" id="downloadHtmlOption">🌐 HTML Document</button>
      <button class="btn-primary" id="downloadTxtOption">📝 Plain Text (.txt)</button>
      <button class="btn-secondary" id="cancelDownload">Cancel</button>
    </div>
  </div>
</div>

<!-- Share Modal -->
<div id="shareModal" class="modal share-modal">
  <div class="modal-content glass">
    <h3 style="text-align: center; margin-bottom: 1rem;">Share Assessment</h3>
    <div class="share-link-container">
      <input type="text" id="shareLink" readonly value="">
      <button id="copyShareLink">Copy</button>
    </div>
    <div class="share-note">
      Anyone with this link can view this assessment
    </div>
    <button class="btn-secondary" id="closeShareModal" style="margin-top: 1.5rem; width: 100%;">Close</button>
  </div>
</div>

<!-- Save Confirmation Modal -->
<div id="saveConfirmModal" class="modal save-confirm-modal">
  <div class="modal-content glass">
    <div class="success-icon">✓</div>
    <h3>Changes Saved!</h3>
    <p>Your assessment has been updated in your history.</p>
    <button class="btn-primary" id="closeSaveModal" style="margin-top: 1rem;">OK</button>
  </div>
</div>

<footer class="site-footer no-print">
  <p>© rehablix — AI tools for rehabilitation</p>
</footer>
