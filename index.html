<!-- index.html — rehablix SPA shell. Routes (js/router.js) swap #appRoot's
     content between views/*.fragment.html; Smart EMR, Project Maker, and
     the pptx export page remain real standalone pages linked normally. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Inline script to set theme before paint -->
  <script>
    (function() {
      var stored = localStorage.getItem('rehab-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else if (stored === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">

  <!-- ============ PRIMARY SEO (js/router.js updates the title per route) ============ -->
  <title>rehablix | AI Clinical Copilot for Physiotherapists, OTs &amp; Rehab Students</title>
  <meta name="description" content="rehablix: chat with Lixa to generate assessment formats, standardized tools, transcripts, presentations, assignments, and study material — plus Smart EMR, Motion & Gait analysis, and more, all in one app.">
  <meta name="keywords" content="rehabilitation AI tools, physiotherapy software, AI clinical copilot, occupational therapy tools, standardized assessment generator, MMSE, Berg Balance Scale">
  <meta name="author" content="rehablix">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://rehablix.com/">

  <!-- ============ PWA / THEME ============ -->
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/img/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/logo.png">

  <!-- ============ PERFORMANCE ============ -->
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://js.paystack.co">
  <link rel="preconnect" href="https://checkout.flutterwave.com">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js" defer></script>
  <!-- Marked for rendering AI responses -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  <!-- docx for Word export (Presentation view) -->
  <script src="https://unpkg.com/docx@7.8.2/build/index.js" defer></script>
  <!-- html2pdf for PDF export (Presentation view) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
  <!-- File-reading helpers for attachments (loaded on demand, listed here for caching) -->
  <link rel="preload" as="script" href="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
  <!-- Loaded directly (not lazily) since the Study view's file-import code expects these globals already present -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

  <!-- Payment Gateway SDKs (used by the Workspace view's subscription card) -->
  <script src="https://js.paystack.co/v1/inline.js" defer></script>
  <script src="https://checkout.flutterwave.com/v3.js" defer></script>

  <!-- ============ Styles — every view's CSS loads upfront, once ============ -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/invite-modal.css">
  <link rel="stylesheet" href="css/error-reporter.css">
  <link rel="stylesheet" href="css/bottom-nav.css">
  <link rel="stylesheet" href="css/ask.css">
  <link rel="stylesheet" href="css/lixa.css">
  <link rel="stylesheet" href="css/workspace.css">
  <link rel="stylesheet" href="css/format.css">
  <link rel="stylesheet" href="css/standardized.css">
  <link rel="stylesheet" href="css/audio.css">
  <link rel="stylesheet" href="css/presentation.css">
  <link rel="stylesheet" href="css/ppt.css">
  <link rel="stylesheet" href="css/study.css">
  <link rel="stylesheet" href="css/assign.css">
  <link rel="stylesheet" href="css/exam.css">
  <link rel="stylesheet" href="css/rom.css">
  <link rel="stylesheet" href="css/gait.css">
  <link rel="stylesheet" href="css/motion-merge.css">
  <link rel="stylesheet" href="css/motion-view.css">
  <link rel="stylesheet" href="css/sets.css">
  <link rel="stylesheet" href="css/sub.css">
  <link rel="stylesheet" href="css/result.css">
  <link rel="stylesheet" href="css/docresult.css">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js');
    }
  </script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-left">
        <div class="logo-text">
          <span class="logo-lop">rehablix</span>
          <span class="logo-full">AI clinical copilot</span>
        </div>
      </div>
      <div class="nav-right" id="navRight">
        <!-- Each view relocates its own route-specific controls (history
             button, workspace switcher, Motion's analysis-type dropdown)
             into this slot on mount, and js/router.js clears it before
             every navigation. -->
        <div id="navbarViewSlot"></div>
        <button class="icon-btn theme-toggle" id="themeToggle" aria-label="theme mode">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.79"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <!-- Auth elements injected by js/auth.js -->
      </div>
    </div>
  </nav>

  <div id="appRoot"><!-- js/router.js injects the active view's fragment here --></div>

  <!-- Toast Container (shared across every view) -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/config.js" defer></script>
  <script src="js/error-reporter.js" defer></script>
  <script src="js/modal.js" defer></script>
  <script src="js/center.js" defer></script>
  <script src="js/invite-modal.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/plan-tiers.js" defer></script>
  <script src="js/plan.js" defer></script>
  <script src="js/handoff.js" defer></script>

  <!-- Lixa chat core + tool generators -->
  <script src="js/lixa-generators/format-gen.js" defer></script>
  <script src="js/lixa-generators/standardized-gen.js" defer></script>
  <script src="js/lixa-generators/audio-gen.js" defer></script>
  <script src="js/lixa-generators/presentation-gen.js" defer></script>
  <script src="js/lixa-generators/study-gen.js" defer></script>
  <script src="js/lixa-generators/assign-gen.js" defer></script>
  <script src="js/ask.js" defer></script>
  <script src="js/lixa.js" defer></script>

  <!-- Workspace view -->
  <script src="js/workspace.js" defer></script>

  <!-- Standalone tool views -->
  <script src="js/format.js" defer></script>
  <script src="js/standardized.js" defer></script>
  <script src="js/audio.js" defer></script>
  <script src="js/presentation.js" defer></script>
  <script src="js/study.js" defer></script>
  <script src="js/assign.js" defer></script>
  <script src="js/exam.js" defer></script>
  <script src="js/views/motion-core.js" defer></script>
  <script src="js/views/motion-view.js" defer></script>
  <script src="js/sets.js" defer></script>
  <script src="js/upgrade.js" defer></script>
  <script src="js/result-types.js" defer></script>
  <script src="js/result.js" defer></script>

  <script src="js/bottom-nav.js" defer></script>
  <script src="js/router.js" defer></script>
</body>
</html>
