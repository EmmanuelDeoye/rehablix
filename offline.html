<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rehablix · Offline</title>
  <link rel="icon" href="/img/logo.png" type="image/png">
  <style>
    :root { --bg: #f5f7f9; --card: #ffffff; --text: #1f2933; --muted: #52606d; --accent: #009688; }
    @media (prefers-color-scheme: dark) { :root { --bg: #12181c; --card: #1a2227; --text: #eef2f6; --muted: #9aa5b1; --accent: #14b8a6; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { max-width: 420px; width: 100%; background: var(--card); border-radius: 20px; padding: 32px 24px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    img { width: 56px; height: 56px; border-radius: 14px; }
    h1 { font-size: 1.3rem; margin: 16px 0 8px; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 20px; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 10px 22px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/img/logo.png" alt="rehablix">
    <h1>You're offline</h1>
    <p>rehablix needs a connection to reach your records and the AI. Anything you already saved is safe — reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
