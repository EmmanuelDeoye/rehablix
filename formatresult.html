<!-- formatresult.html — format results now render in the shared result.html
     editor (RESULT_TYPES.format) at index.html?type=format&id=...#/result,
     not their own page. Kept only to redirect old bookmarks/links. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (!params.has('type')) params.set('type', 'format');
      window.location.replace('index.html?' + params.toString() + '#/result');
    })();
  </script>
</head>
<body>
  <p>This assessment result has moved — redirecting…</p>
</body>
</html>
