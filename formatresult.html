<!-- formatresult.html — format results now render in their own dedicated
     view/editor at index.html?id=...#/formatview (js/views/formatview-view.js),
     not their own page. Kept only to redirect old bookmarks/links. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      params.delete('type');
      window.location.replace('index.html?' + params.toString() + '#/formatview');
    })();
  </script>
</head>
<body>
  <p>This assessment result has moved — redirecting…</p>
</body>
</html>
