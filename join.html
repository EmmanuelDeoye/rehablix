<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      var stored = localStorage.getItem('rehab-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
    })();
  </script>
  <meta charset="UTF-8">
  <script>
    // Development logging is off unless window.REHABLIX_DEBUG is true (or
    // localStorage 'rehablix_debug' = '1'). Warnings and errors always show.
    (function () {
      try { if (localStorage.getItem('rehablix_debug') === '1') window.REHABLIX_DEBUG = true; } catch (e) {}
      ['log', 'info', 'debug'].forEach(function (k) {
        var orig = console[k];
        console[k] = function () { if (window.REHABLIX_DEBUG) orig.apply(console, arguments); };
      });
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">
  <title>rehablix · Center Access</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js" defer integrity="sha384-4gq9w/AGf72FXdNQ3Kn3EqWP7633NbCMjpYHt8YCZyXf23o2opcuAr4cif41tLrC" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js" defer integrity="sha384-xtdq4MQqPj1dB5DQsuw9O7dh4kHhMP/Wp5u8O1jiaWiou13ZfJIgiccjtVK2pBhL" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js" defer integrity="sha384-5PDE6CZvnNIJI5xu68GIFoOO3U73lAnRLBwPBmmKjWnYnYwKEHWr/ghtGooEOXGb" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha384-5e2ESR8Ycmos6g3gAKr1Jvwye8sW4U1u/cAKulfVJnkakCcMqhOudbtPnvJ+nbv7" crossorigin="anonymous">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/join.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-left">
        <div class="logo-text">
          <span class="logo-lop">rehablix</span>
        </div>
      </div>
      <div class="nav-right">
        <button class="icon-btn theme-toggle" id="themeToggle" aria-label="theme mode">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <!-- Auth elements injected by modal.js -->
      </div>
    </div>
  </nav>

  <main class="join-main">
    <div class="join-card" id="joinCard">
      <div class="join-spinner"></div>
      <p>Looking up this link…</p>
    </div>
  </main>

  <script src="js/config.js" defer></script>
  <script src="js/modal.js" defer></script>
  <script src="js/center.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/join.js" defer></script>
</body>
</html>
